      - name: Add LO-019 catalog record
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'lib/data/works.ts';
          let content = fs.readFileSync(path, 'utf8');
          if (content.includes('id: "LO-019"')) {
            console.log('LO-019 already exists in works.ts');
            process.exit(0);
          }
          const entry = `  {
    id: "LO-019",
    slug: "ohota",
    artist,
    title: "Охота",
    date: "1958",
    period: "early",
    technique: "oil",
    material: "Основа уточняется",
    dimensions: "Около 43 × 27 см по оборотной надписи; требуется сверка",
    genre: "genre_composition",
    themes: ["охота", "северный промысел", "лёд", "вода"],
    descriptionShort:
      "Сцена охоты на льду: на переднем плане лежит добытый морской зверь, в глубине у кромки воды видна фигура в лодке. Работа построена на резком сопоставлении белого снега, серо-зелёной воды и тёмной полосы дальнего льда.",
    descriptionFull:
      "Композиция сдержанна и напряжённа: почти пустое ледовое пространство подчёркивает драматизм события, а маленькая фигура охотника в лодке задаёт масштаб северного промысла. Красные пятна на снегу не превращены в эффект, а включены в общий холодный колорит работы. Оборотная надпись фиксирует название «Охота», имя Льва Овчинникова и дату 25.10.58; вторая строка читается неуверенно и требует дополнительной проверки.",
    imageFull: "/works/lev/full/lo-019-ohota.jpg",
    imageThumb: "/works/lev/thumbs/lo-019-ohota.jpg",
    inscriptions: [
      "Оборот: «Охота».",
      "Оборот: «Овчинников Лев»; дата читается как «25.10.58».",
      "Размер на обороте читается как «27 × 43» или близко к этому; требуется контрольный обмер.",
      "Вторая строка после названия читается неуверенно; требует сверки по оригиналу."
    ],
    attributionStatus: "confirmed",
    provenance: "Собрание семьи художника",
    isPublic: true,
  }`;
          const idx = content.lastIndexOf('\n];');
          if (idx === -1) throw new Error('Could not find works array ending');
          content = content.slice(0, idx) + '\n' + entry + ',\n' + content.slice(idx + 1);
          fs.writeFileSync(path, content);
          NODE

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Commit LO-019
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/data/works.ts public/works/lev/full/lo-019-ohota.jpg public/works/lev/thumbs/lo-019-ohota.jpg
          if git diff --cached --quiet; then
            echo "No LO-019 changes to commit."
            exit 0
          fi
          git commit -m "Add LO-019 Ohota to Lev catalog"
          git push
