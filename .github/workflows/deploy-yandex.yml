name: Deploy static site to Yandex Object Storage

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ru-central1
      YC_BUCKET: ${{ secrets.YC_BUCKET }}
      YC_ENDPOINT: https://storage.yandexcloud.net

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build static site
        run: npm run build

      - name: Verify static export
        run: |
          test -d out
          test -f out/index.html
          test -d out/_next

      - name: Install AWS CLI
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install awscli

      # Загрузка идёт двумя проходами, чтобы у файлов сохранялся правильный
      # Content-Type. Прежний вариант выставлял долгий кэш отдельным шагом
      # `s3 cp --metadata-directive REPLACE`, а этот ключ стирает всю метаданную,
      # включая Content-Type: css и js начинали отдаваться как text/plain,
      # и браузер переставал применять таблицу стилей. При загрузке из локальной
      # папки aws cli определяет тип по расширению сам.
      - name: Deploy site (short cache)
        run: |
          aws --endpoint-url="$YC_ENDPOINT" \
            s3 sync out/ "s3://$YC_BUCKET/" \
            --delete \
            --exclude "_next/*" \
            --cache-control "public, max-age=300"

      - name: Deploy Next static assets (long cache)
        run: |
          aws --endpoint-url="$YC_ENDPOINT" \
            s3 sync out/_next/ "s3://$YC_BUCKET/_next/" \
            --delete \
            --cache-control "public, max-age=31536000, immutable"

      - name: Verify content types
        run: |
          set -e
          key=$(cd out && find _next -name '*.css' | head -1)
          ct=$(aws --endpoint-url="$YC_ENDPOINT" s3api head-object \
                 --bucket "$YC_BUCKET" --key "$key" \
                 --query ContentType --output text)
          echo "$key -> $ct"
          case "$ct" in
            text/css*) echo "Content-Type в порядке" ;;
            *) echo "ОШИБКА: ожидался text/css, получен $ct"; exit 1 ;;
          esac
