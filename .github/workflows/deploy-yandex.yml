name: Deploy static site to Yandex Object Storage

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ru-central1
      YC_BUCKET: ${{ secrets.YC_BUCKET }}
      YC_ENDPOINT: https://storage.yandexcloud.net

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build static site
        run: npm run build

      - name: Verify static export
        run: |
          test -d out
          test -f out/index.html
          test -d out/_next

      - name: Install AWS CLI
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install awscli

      - name: Deploy to Yandex Object Storage
        run: |
          aws --endpoint-url="$YC_ENDPOINT" \
            s3 sync out/ "s3://$YC_BUCKET/" \
            --delete \
            --cache-control "public, max-age=300"

      - name: Set long cache for Next static assets
        run: |
          aws --endpoint-url="$YC_ENDPOINT" \
            s3 cp "s3://$YC_BUCKET/_next/" "s3://$YC_BUCKET/_next/" \
            --recursive \
            --metadata-directive REPLACE \
            --cache-control "public, max-age=31536000, immutable"
